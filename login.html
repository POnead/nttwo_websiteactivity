<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | CafeTrack</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <main class="split">


    <section class="brand">
      <h1>CafeTrack</h1>
      <p>Merrylane Cafe Foodhub Inventory System</p>

      <svg viewBox="0 0 220 170" fill="none" stroke="#55705A" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <path d="M110 10v55"/>
        <path d="M108 42C72 26 46 40 40 70c30 12 56-2 68-28Z"/>
        <path d="M100 48C82 54 62 61 48 69" stroke-width="2"/>
        <path d="M112 42c36-16 62-2 68 28-30 12-56-2-68-28Z"/>
        <path d="M120 48c18 6 38 13 52 21" stroke-width="2"/>
        <g transform="translate(70 120) rotate(-18)">
          <ellipse rx="27" ry="19"/>
          <path d="M-24 -4C-8 4 8 6 24 2" stroke-width="2"/>
        </g>
        <g transform="translate(132 112) rotate(14)">
          <ellipse rx="24" ry="17"/>
          <path d="M-21 -3C-7 3 7 5 21 2" stroke-width="2"/>
        </g>
        <g transform="translate(102 148) rotate(-6)">
          <ellipse rx="22" ry="16"/>
          <path d="M-19 -3C-6 3 6 4 19 1" stroke-width="2"/>
        </g>
      </svg>
    </section>

    <section class="form-side">
      <form class="card" id="loginForm" action="#" novalidate>
        <h2>Welcome Back</h2>

        <div class="demo-box">
          <p class="demo-title">Test Account</p>
          <p><span>Email:</span> demo@cafetrack.com</p>
          <p><span>Password:</span> Coffee#2026</p>
        </div>

        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
        </div>

        <p class="attempts-msg" id="attemptsMsg">Attempts left: <span id="attemptsLeft">3</span></p>

        <button class="btn" type="submit">Log In</button>

        <p class="links"><a href="#">Forgot Password?</a></p>
        <p class="links">Don't have an account? <a href="register.html">Register</a></p>
      </form>
    </section>

  </main>

  <script>
    // Demo account 
    const DEMO_EMAIL = "demo@cafetrack.com";
    const DEMO_PASSWORD = "Coffee#2026";
    const MAX_ATTEMPTS = 3;
    let attemptsLeft = MAX_ATTEMPTS;


    function showAttempts() {
      if (attemptsLeft === 0) {
        $("#attemptsMsg").text("No attempts left. Please refresh the page.");
        $("#email, #password, .btn").prop("disabled", true);
        return;
      }
      $("#attemptsMsg").find("#attemptsLeft").text(attemptsLeft);
      $("#attemptsMsg").toggleClass("low", attemptsLeft <= 1);
    }

    function showCredError() {
      $(".cred-error").remove();
      $("#email").after(
        $("<label>")
          .addClass("error-msg cred-error")
          .text("Email or password is incorrect.")
      );
    }

    $(document).ready(function () {

      $("#loginForm").validate({
        errorClass: "error-msg",
        errorPlacement: function (error, element) {
          error.appendTo(element.closest(".field"));
        },
        highlight: function (element) {
          $(element).closest(".field").addClass("invalid");
        },
        unhighlight: function (element) {
          $(element).closest(".field").removeClass("invalid");
        },
        rules: {
          email: {
            required: true,
            email: true
          },
          password: {
            required: true
          }
        },
        submitHandler: function () {
          const email = $("#email").val().trim();
          const password = $("#password").val();

          if (email.toLowerCase() !== DEMO_EMAIL || password !== DEMO_PASSWORD) {
            attemptsLeft--;
            showAttempts();
            showCredError();
            return;
          }

          // Success -> balik sa landing page
          window.location.href = "index.html";
        }
      });

      // Linisin ang "incorrect" error pagkatapos ng bawat submit
      $("#loginForm").on("submit", function () {
        $(".cred-error").remove();
      });

      showAttempts();
    });
  </script>
</body>
</html>
