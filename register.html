<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | CafeTrack</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js" integrity="sha512-qu7dMuIm2f0KcKZ3BOoP4c+Hn+r4E8PbD2Ro4rmKsOyheCxcwhzQpf6SojA76dn+owqfANzfTFUTkGA+HpHjOA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
  <main class="split">

    <section class="brand">
      <h1>CafeTrack</h1>
      <p>Merrylane Cafe Foodhub Inventory System</p>

      <svg viewBox="0 0 220 170" fill="none" stroke="#55705A" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <path d="M110 10v55"/>
        <path d="M108 42C72 26 46 40 40 70c30 12 56-2 68-28Z"/>
        <path d="M100 48C82 54 62 61 48 69" stroke-width="2"/>
        <path d="M112 42c36-16 62-2 68 28-30 12-56-2-68-28Z"/>
        <path d="M120 48c18 6 38 13 52 21" stroke-width="2"/>
        <g transform="translate(70 120) rotate(-18)">
          <ellipse rx="27" ry="19"/>
          <path d="M-24 -4C-8 4 8 6 24 2" stroke-width="2"/>
        </g>
        <g transform="translate(132 112) rotate(14)">
          <ellipse rx="24" ry="17"/>
          <path d="M-21 -3C-7 3 7 5 21 2" stroke-width="2"/>
        </g>
        <g transform="translate(102 148) rotate(-6)">
          <ellipse rx="22" ry="16"/>
          <path d="M-19 -3C-6 3 6 4 19 1" stroke-width="2"/>
        </g>
      </svg>
    </section>

    <section class="form-side">
      <form class="card" id="registerForm" action="#" novalidate>
        <h2>Create Account</h2>

        <div class="field">
          <input type="text" id="name" name="name" placeholder="Full Name" autocomplete="name" required>
        </div>

        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email Address" autocomplete="email" required>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder="Password" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="field">
          <input type="password" id="confirm" name="confirm" placeholder="Confirm Password" minlength="8" autocomplete="new-password" required>
        </div>

        <button class="btn" type="submit">Register</button>

        <p class="links">Already have an account? <a href="login.html">Log In</a></p>
      </form>
    </section>

  </main>

  <script>
    $(document).ready(function () {

      //kailangan ng special character
      $.validator.addMethod("special", function (value) {
        return /[!@#$%^&*()_+\-=\[\]{};':",.<>/?`~\\]/.test(value);
      }, "Please include at least one special character (! @ # $ % & *).");

      $("#registerForm").validate({
        errorClass: "error-msg",
        errorPlacement: function (error, element) {
          error.appendTo(element.closest(".field"));
        },
        highlight: function (element) {
          $(element).closest(".field").addClass("invalid");
        },
        unhighlight: function (element) {
          $(element).closest(".field").removeClass("invalid");
        },
        rules: {
          name: {
            required: true,
            minlength: 2
          },
          email: {
            required: true,
            email: true
          },
          password: {
            required: true,
            minlength: 8,
            special: true
          },
          confirm: {
            required: true,
            equalTo: "#password"
          }
        },
        submitHandler: function () {
          // Success -> proceed to login
          window.location.href = "login.html";
        }
      });

    });
  </script>
</body>
</html>
